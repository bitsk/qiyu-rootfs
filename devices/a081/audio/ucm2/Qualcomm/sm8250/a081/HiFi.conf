SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='MultiMedia1 Mixer VA_CODEC_DMA_TX_0' 1"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer VA_CODEC_DMA_TX_0' 0"
	]
}

SectionDevice."Mic" {
	Comment "Internal DMIC0 and DMIC2"
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA DMIC MUX1' DMIC2"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA_DEC1 Volume' 84"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA DMIC MUX1' ZERO"
		cset "name='VA DMIC MUX0' ZERO"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 2
	}
}
